spring:
  application:
    name: hutka-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/hutka
    username: ${DB_USER:hutka}
    password: ${DB_PASSWORD:hutka}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # НОВОЕ: Quartz (таймеры booking). Таблицы создаёт Flyway (V4), а не Quartz.
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never   # важно: скрипт Quartz начинается с DROP TABLE
    properties:
      org.quartz.scheduler.instanceName: hutka-scheduler
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: false
      org.quartz.threadPool.threadCount: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}      # было прописано в файле
    password: ${MAIL_PASSWORD:}      # было прописано в файле; задавать только окружением
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:

  payments:
    provider: fake                 # fake (по умолчанию) | bepaid (заготовка, ничего не делает)
    currency: BYN
    timezone: Europe/Minsk
    payout-cron: "0 0 3 * * MON"   # недельные выплаты: понедельник 03:00 (формат cron Spring)
    max-attempts: 3                # попыток списания/выплаты, потом — ручной разбор
    sweep-interval-ms: 300000      # как часто sweeper ищет брони без платежа и повторяет неудачи
    sweep-initial-delay-ms: 90000
    fake:
      mode: success

  weather:
    base-url: https://api.open-meteo.com      # коммерческий план: https://customer-api.open-meteo.com
    api-key: ${OPEN_METEO_API_KEY:}           # нужен для коммерческого плана, см. WEATHER_DECISIONS.md п. 1
    timezone: Europe/Minsk
    default-latitude: 53.9006                 # координаты по умолчанию для виджета (центр Минска, проверьте)
    default-longitude: 27.5590
    wind-gust-threshold-kmh: 60               # порыв ≥ порога → strong_wind
    visibility-threshold-m: 1000              # видимость < порога → fog
    cache-ttl-minutes: 60
    connect-timeout-ms: 3000
    read-timeout-ms: 8000

  group-trips:
    timezone: Europe/Minsk        # день поездки и «сегодня» считаются в этом поясе
    sweep-interval-ms: 900000     # как часто прошедшие поездки переводятся в finished
    sweep-initial-delay-ms: 60000

  ai:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    hourly-limit: 30
    auto-escalate-danger: false
  pddtest:
    seed-enabled: true
    seed-active: true
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  # НОВОЕ: адрес панели администратора (adminapi, CORS для /admin/**). Если панель на том же адресе, что и фронтенд клиентов,
  # можно оставить как есть
  admin-base-url: ${ADMIN_BASE_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-real-random-secret-at-least-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  external:
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    open-meteo-base-url: https://api.open-meteo.com
    nominatim-base-url: https://nominatim.openstreetmap.org

  # НОВОЕ: договор (6.6)
  agreement:
    storage-dir: ${AGREEMENT_STORAGE_DIR:./data/agreements}
    timezone: Europe/Minsk

  booking:
    sweep-interval-ms: 300000
    photo-allowed-hosts: ${PHOTO_ALLOWED_HOSTS:}   # напр. "<проект>.supabase.co"; пусто = только https

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

logging:
  level:
    com.hutka.backend: DEBUG
    org.hibernate.SQL: DEBUG