spring:
  application:
    name: hutka-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/hutka
    username: ${DB_USER:hutka}
    password: ${DB_PASSWORD:hutka}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: adminemailfft@gmail.com
    password: yute sfky lakj ycqw
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-real-random-secret-at-least-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  external:
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    open-meteo-base-url: https://api.open-meteo.com
    nominatim-base-url: https://nominatim.openstreetmap.org

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

logging:
